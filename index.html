<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>烤肠店 · 激活码服务</title>
<meta name="description" content="小米手环 10 Pro 快应用「烤肠店」自助兑换：填入兑换码与手环上的设备码，即可在本机算出激活码。全部计算在你的浏览器里完成，不会上传。">
<meta name="theme-color" content="#101216">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header>
    <h1>烤肠店 · 激活码服务</h1>
    <div class="sub">小米手环 10 Pro 快应用 · 从路边摊到一家公司</div>
    <div class="price">售价 1 元</div>
  </header>

  <section class="pane" id="pane-buy">
    <div class="card">
      <h2>自助兑换</h2>
      <p class="dim">把<b>兑换码</b>和手环上的<b>设备码</b>填进来，直接得到激活码。全部计算在你自己的浏览器里完成，不会上传。只有站点已发行的兑换码才能兑换。</p>
      <label class="field" for="rRc">兑换码（12 位数字，无需输分隔符）</label>
      <input type="text" id="rRc" inputmode="numeric" autocomplete="off" placeholder="例如 010000000136">
      <label class="field" for="rDev">设备码（10 位数字）</label>
      <input type="text" id="rDev" inputmode="numeric" autocomplete="off" placeholder="例如 2136393151">
      <div class="row">
        <button id="rBtn">兑换出激活码</button>
        <button class="ghost" id="rClear">清空</button>
      </div>
      <div class="msg" id="rMsg"></div>
      <div class="out" id="rOut" hidden>
        <div class="ac" id="rAc">—</div>
        <div class="dev" id="rLine"></div>
        <div class="verdict" id="rVerdict"></div>
        <div class="row"><button class="ghost" id="rCopy" disabled>复制激活码</button></div>
      </div>
      <div class="note">
        兑换码来自<b>爱发电</b>下单后商家私信发给你的一串 12 位数字；设备码是手环上「烤肠店」激活页显示的那串 10 位数字。两样一起才能算码：兑换码是付款凭证，设备码是绑定目标。算出的激活码拿到手环激活页输入，点「激活」即可进入游戏。
      </div>
    </div>
  </section>

  <footer>
    烤肠店 · 激活码服务 · 静态站点，数据不出浏览器
  </footer>
</div>

<script src="js/issued-codes.js"></script>
<script src="js/activation-core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
